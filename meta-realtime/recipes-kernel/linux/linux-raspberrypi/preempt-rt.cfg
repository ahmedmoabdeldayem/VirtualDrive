# CONFIG_PREEMPT_RT requires the RT patchset — omitted here because the
# kernel-meta patches do not apply cleanly to RPi5 6.6.x. Enable PREEMPT
# for voluntary preemption which is available in mainline.
CONFIG_PREEMPT=y

# 1000 Hz tick rate: 1ms timer resolution required for our cyclic thread
CONFIG_HZ_1000=y
CONFIG_HZ=1000

# High-resolution timers: required for clock_nanosleep TIMER_ABSTIME precision
CONFIG_HIGH_RES_TIMERS=y

# Disable CPU idle states: prevents latency spikes from C-state exit latency
# on an RT system that must hit sub-100µs wakeup deadlines
# CONFIG_CPU_IDLE is not set

# Disable transparent hugepages: THP compaction causes unpredictable latency
# bursts that can exceed RT deadlines
# CONFIG_TRANSPARENT_HUGEPAGE is not set

# RT mutex priority inheritance: prevents priority inversion in RT threads
CONFIG_RT_MUTEXES=y

# IRQ threading: allows moving specific IRQ handlers to RT threads
CONFIG_IRQ_FORCED_THREADING=y

# Preemptible RCU: required by PREEMPT_RT
CONFIG_PREEMPT_RCU=y

# Real-time group scheduling
CONFIG_RT_GROUP_SCHED=y
