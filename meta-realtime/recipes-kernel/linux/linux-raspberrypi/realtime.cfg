# Full dyntick (nohz_full): stops the tick on isolated CPUs when only one
# runnable task is present, eliminating scheduling jitter
CONFIG_NO_HZ_FULL=y
CONFIG_NO_HZ=y

# RCU offload: moves RCU callbacks off isolated CPUs to prevent latency spikes
CONFIG_RCU_NOCB_CPU=y

# Disable NUMA: RPi5 is non-NUMA; the config option can cause overhead
# CONFIG_NUMA is not set

# Disable page migration: prevents latency from memory compaction
# CONFIG_MIGRATION is not set

# Lock statistics: disabled in production RT to avoid overhead
# CONFIG_LOCK_STAT is not set
# CONFIG_DEBUG_LOCK_ALLOC is not set

# Tracing support for latency analysis with cyclictest/ftrace
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_IRQSOFF_TRACER=y
CONFIG_PREEMPT_TRACER=y
CONFIG_HWLAT_TRACER=y
CONFIG_OSNOISE_TRACER=y
CONFIG_TIMERLAT_TRACER=y

# CPU affinity and isolation support
CONFIG_CPUMASK_OFFSTACK=y

# mlockall support: allows RT processes to lock all memory pages
CONFIG_SECCOMP=y
