BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "realtime"
BBFILE_PATTERN_realtime = "^${LAYERDIR}/"
BBFILE_PRIORITY_realtime = "6"

LAYERDEPENDS_realtime = "core raspberrypi"
LAYERSERIES_COMPAT_realtime = "scarthgap"
