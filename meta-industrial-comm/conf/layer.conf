BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "industrial-comm"
BBFILE_PATTERN_industrial-comm = "^${LAYERDIR}/"
BBFILE_PRIORITY_industrial-comm = "6"

LAYERDEPENDS_industrial-comm = "core openembedded-layer networking-layer"
LAYERSERIES_COMPAT_industrial-comm = "scarthgap"
