BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "drive-sim"
BBFILE_PATTERN_drive-sim = "^${LAYERDIR}/"
BBFILE_PRIORITY_drive-sim = "7"

LAYERDEPENDS_drive-sim = "core raspberrypi industrial-comm realtime"
LAYERSERIES_COMPAT_drive-sim = "scarthgap"
