DISTRO = "virtualdrive"
DISTRO_NAME = "VirtualDrive Industrial OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "scarthgap"

SDK_VENDOR = "-virtualdrivesdk"
SDK_VERSION = "${DISTRO_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

DISTRO_FEATURES ?= "acl argp ext2 ipv4 ipv6 largefile pam usbgadget \
                    usbhost wifi xattr nfs zeroconf pci vfat \
                    alsa bluetooth systemd"

DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
VIRTUAL-RUNTIME_dev_manager = "udev"

# Inherit from poky base distro
require conf/distro/poky.conf

# RT scheduling support in userspace
DISTRO_FEATURES:append = " seccomp"

# Enable RT scheduler in kernel (handled by meta-realtime layer)
# Set high-resolution timers as default
KERNEL_FEATURES:append = " features/rt/rt.scc"

# Timezone
DEFAULT_TIMEZONE = "UTC"

# Compiler optimizations for Cortex-A76
DEFAULTTUNE ?= "cortexa76"

# No X11 / Wayland — headless RT system
DISTRO_FEATURES:remove = "x11 wayland vulkan"

# Package management format
PACKAGE_CLASSES = "package_ipk"

# Prefer systemd-networkd for networking (lighter than NetworkManager)
VIRTUAL-RUNTIME_net_manager = "connman"
