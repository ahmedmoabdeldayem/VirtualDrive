#@TYPE: Machine
#@NAME: raspberrypi5-rt
#@DESCRIPTION: Raspberry Pi 5 with PREEMPT_RT kernel

require conf/machine/raspberrypi5.conf

# Override kernel provider to use our RT-patched version
PREFERRED_PROVIDER_virtual/kernel = "linux-raspberrypi"
PREFERRED_VERSION_linux-raspberrypi = "6.6%"

# Machine features kept from raspberrypi5, plus RT
MACHINE_FEATURES:append = " rtc"

# GPU memory: minimum for headless RT operation
# Frees more memory for RT tasks and avoids GPU DMA interference
GPU_MEM = "16"

# Reduce boot time for RT systems
BOOT_SPACE = "65536"

# Enable hardware interfaces
ENABLE_UART = "1"
ENABLE_SPI0 = "1"
ENABLE_I2C = "1"

# Disable unnecessary hardware to reduce interrupt load
DISABLE_OVERSCAN = "1"

# config.txt additions for RT operation
RPI_EXTRA_CONFIG = "\
# Disable Bluetooth to keep UART on /dev/ttyAMA0\n\
dtoverlay=disable-bt\n\
\n\
# Force CPU governor to performance for RT\n\
force_turbo=1\n\
\n\
# Disable dynamic voltage scaling\n\
over_voltage=0\n\
\n\
# Enable SPI\n\
dtparam=spi=on\n\
\n\
# Enable I2C at 400kHz\n\
dtparam=i2c_arm=on,i2c_arm_baudrate=400000\n\
\n\
# Enable UART (already enabled by ENABLE_UART but explicit here)\n\
enable_uart=1\n\
"

# Isolate CPU3 for RT task (isolcpus passed to kernel cmdline)
APPEND:append = " isolcpus=3 nohz_full=3 rcu_nocbs=3 irqaffinity=0-2"
