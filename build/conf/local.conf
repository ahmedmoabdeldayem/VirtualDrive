MACHINE = "raspberrypi5-rt"
DISTRO = "virtualdrive"

BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"

DL_DIR = "${HOME}/yocto-downloads"
SSTATE_DIR = "${HOME}/yocto-sstate"

# Preserve space by removing build artifacts after packaging
INHERIT += "rm_work"

# Use systemd as init manager
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Package format
PACKAGE_CLASSES ?= "package_rpm"

# Extra image features useful for development
EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"

# Uncomment to enable network-based package management on target
# EXTRA_IMAGE_FEATURES += "package-management"

# Uncomment to build SDK
# SDKMACHINE ?= "x86_64"

# Speed up incremental builds
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    ABORT,${TMPDIR},100M,1K \
    ABORT,${DL_DIR},100M,1K \
    ABORT,${SSTATE_DIR},100M,1K \
    ABORT,/tmp,10M,1K \
"

CONF_VERSION = "2"

# Protocol library recipes (soes, p-net, opener) use AUTOREV which contacts
# the git remote during BitBake's dependency resolution phase. On first use,
# pre-populate the SRCREV cache before a full image build:
#   bitbake -c fetchall soes p-net opener
# After that, set BB_SRCREV_POLICY = "cache" here to prevent repeated network
# lookups in incremental builds.
